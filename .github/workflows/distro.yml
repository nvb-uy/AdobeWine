name: distro check
# Installs the release tarball with each distribution's documented runtime dependencies
# and checks that Wine starts, creates a prefix and runs 64-bit and 32-bit programs.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to test (default: latest)"
        required: false
  workflow_call:
    inputs:
      tag:
        description: "release tag to test"
        type: string
        required: true

permissions:
  contents: read

jobs:
  distro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [archlinux:latest, debian:13, ubuntu:24.04, fedora:42, opensuse/tumbleweed]
    steps:
      - uses: actions/checkout@v5
      - name: download release tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag="$TAG"
          # newest release, pre-releases included ("latest" skips them)
          [ -n "$tag" ] || tag="$(gh release list -R "$GITHUB_REPOSITORY" -L 1 --json tagName -q '.[0].tagName')"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'photoshopwine-runtime-*-x86_64.tar.zst' -O photoshopwine.tar.zst
      - name: check
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          tests/distro/check.sh photoshopwine.tar.zst "$IMAGE" | tee result.txt
          grep -q '^deps: OK' result.txt
          grep -q '^wineboot exit: 0' result.txt
          grep -q '^64-bit: ok64' result.txt
          grep -q '^32-bit (WoW64): ok32' result.txt
